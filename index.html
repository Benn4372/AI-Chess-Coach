<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Coach AI</title>
  <link rel="stylesheet" href="lib/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-left">
      <h1 class="site-title">Chess Coach AI</h1>
    </div>
    <div class="header-right">
      <label for="skill-level" class="skill-label">Level:</label>
      <select id="skill-level" class="skill-select">
        <option value="beginner">Beginner</option>
        <option value="intermediate" selected>Intermediate</option>
        <option value="advanced">Advanced</option>
      </select>
      <button id="settings-btn" class="icon-btn" aria-label="Settings" title="Settings">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="10" cy="10" r="3"/>
          <path d="M10 1v2M10 17v2M1 10h2M17 10h2M3.93 3.93l1.41 1.41M14.66 14.66l1.41 1.41M3.93 16.07l1.41-1.41M14.66 5.34l1.41-1.41"/>
        </svg>
      </button>
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="10" cy="10" r="6"/>
          <path d="M10 4V1M10 19v-3M4 10H1M19 10h-3M5.76 5.76L3.64 3.64M16.36 16.36l-2.12-2.12M5.76 14.24l-2.12 2.12M16.36 3.64l-2.12 2.12"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="app-layout">
    <section class="board-area" aria-label="Chess board">
      <div id="board" class="board-container"></div>
      <div id="game-status" class="game-status"></div>
      <div class="board-controls">
        <button id="btn-flip" class="ctrl-btn" aria-label="Flip board" title="Flip board">Flip</button>
        <button id="btn-first" class="ctrl-btn" aria-label="First move" title="First move">&laquo;</button>
        <button id="btn-prev" class="ctrl-btn" aria-label="Previous move" title="Previous move">&lsaquo;</button>
        <button id="btn-next" class="ctrl-btn" aria-label="Next move" title="Next move">&rsaquo;</button>
        <button id="btn-last" class="ctrl-btn" aria-label="Last move" title="Last move">&raquo;</button>
        <button id="btn-undo" class="ctrl-btn" aria-label="Undo move" title="Undo move">Undo</button>
        <button id="btn-reset" class="ctrl-btn" aria-label="New game" title="New game">Reset</button>
      </div>
    </section>

    <aside class="coach-panel" aria-label="Coach panel">
      <div class="panel-section">
        <h2 class="panel-heading">Moves</h2>
        <div id="move-list" class="move-list"></div>
      </div>
      <div class="panel-section panel-section--coach">
        <h2 class="panel-heading">Coach</h2>
        <div id="coach-messages" class="coach-messages">
          <p class="coach-placeholder">Play a game and the coach will offer insights on key positions.</p>
        </div>
        <button id="btn-coach" class="coach-btn" disabled>Coach me on this move</button>
      </div>
      <div class="panel-actions">
        <button id="btn-import" class="action-btn">Import PGN</button>
        <button id="btn-export" class="action-btn">Export PGN</button>
      </div>
    </aside>
  </main>

  <div id="pgn-modal" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-labelledby="pgn-modal-title">
      <h2 id="pgn-modal-title" class="modal-title">Import PGN</h2>
      <textarea id="pgn-input" class="pgn-textarea" rows="12" placeholder="Paste your PGN here...&#10;&#10;Example:&#10;1. e4 e5 2. Nf3 Nc6 3. Bb5 a6"></textarea>
      <p id="pgn-error" class="pgn-error" hidden></p>
      <div class="modal-actions">
        <button id="pgn-cancel" class="action-btn">Cancel</button>
        <button id="pgn-load" class="coach-btn">Load Game</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 Chess Coach AI &mdash; <a href="https://github.com/Benn4372" target="_blank" rel="noopener">GitHub</a></p>
  </footer>

  <div id="toast" class="toast"></div>

  <script src="lib/jquery-3.7.1.min.js"></script>
  <script src="lib/chess-0.10.3.min.js"></script>
  <script src="lib/chessboard-1.0.0.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
